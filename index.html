<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jayden</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #14161a;
      --muted: #5f6672;
      --accent: #1f6feb;
      --line: #e4e7ec;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1013;
        --card: #16191e;
        --text: #eef1f5;
        --muted: #9aa3af;
        --accent: #58a6ff;
        --line: #262b33;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1013;
      --card: #16191e;
      --text: #eef1f5;
      --muted: #9aa3af;
      --accent: #58a6ff;
      --line: #262b33;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }
    main {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      transition: background 0.2s, border-color 0.2s;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .date {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #toggle {
      background: none;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    #toggle:hover { border-color: var(--accent); }
    h1 {
      font-size: clamp(2.4rem, 10vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    h1 span { color: var(--accent); }
    .role {
      margin-top: 8px;
      font-size: 1rem;
      color: var(--muted);
    }
    hr {
      border: none;
      height: 1px;
      background: var(--line);
      margin: 28px 0;
    }
    .label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .problem {
      font-size: 1.1rem;
      line-height: 1.6;
    }
    @media (min-width: 640px) {
      main { padding: 48px 44px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <p class="date" id="today">Loading date</p>
      <button id="toggle" type="button">Dark</button>
    </div>

    <h1>Jayden<span>.</span></h1>
    <p class="role">MSc student, National College of Ireland</p>

    <hr>

    <p class="label">A problem I care about</p>
    <p class="problem">
      Finance teams still lose days every month to manual spreadsheet work, and I want to help them spend that time on decisions instead.
    </p>
  </main>

  <script>
    document.getElementById("today").textContent =
      new Date().toLocaleDateString("en-IE", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    const root = document.documentElement;
    const btn = document.getElementById("toggle");
    const isDark = () =>
      root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
    const label = () => (btn.textContent = isDark() ? "Light" : "Dark");

    btn.addEventListener("click", () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      label();
    });
    label();
  </script>
</body>
</html>
